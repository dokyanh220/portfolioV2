<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello!</title>
    <style>
        body {
            background-color: #ffe6ea;
            font-family: 'Comic Sans MS', 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            color: #ff6699;
            overflow: hidden; /* Prevent scrolling from floating images */
            position: relative;
        }
        .container {
            background-color: white;
            padding: 40px 60px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 102, 153, 0.2);
            border: 3px dashed #ff99bb;
            animation: float 3s ease-in-out infinite;
            min-width: 300px;
            z-index: 10;
        }
        h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(255, 153, 187, 0.3);
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
        }
        .fade-out {
            opacity: 0;
        }
        .heart {
            color: #ff3366;
            font-size: 1.2em;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }
        
        /* Photo Frames */
        .photo-frame {
            position: absolute;
            background: #fff;
            padding: 12px 12px 40px 12px;
            box-shadow: 0 15px 35px rgba(255, 102, 153, 0.15), 0 5px 15px rgba(0,0,0,0.05);
            border-radius: 4px;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.5s ease-in-out, transform 0.5s;
            pointer-events: none;
        }
        .photo-frame img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 2px;
            border: 1px solid #f9f9f9;
        }
        .photo-frame.show {
            opacity: 1;
        }
        
        .photo-1 {
            top: 10%;
            left: 10%;
            animation: float-p1 6s ease-in-out infinite;
        }
        .photo-2 {
            bottom: 12%;
            left: 15%;
            animation: float-p2 7s ease-in-out infinite;
        }
        .photo-3 {
            bottom: 15%;
            right: 12%;
            animation: float-p3 5.5s ease-in-out infinite;
        }
        
        .photo-first-1 {
            top: 15%;
            right: 15%;
            animation: float-pf1 5s ease-in-out infinite;
        }
        .photo-first-2 {
            bottom: 20%;
            left: 10%;
            animation: float-pf2 6s ease-in-out infinite;
        }

        @keyframes float-p1 {
            0% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(-20px) rotate(-4deg); }
            100% { transform: translateY(0) rotate(-8deg); }
        }
        @keyframes float-p2 {
            0% { transform: translateY(0) rotate(10deg); }
            50% { transform: translateY(-15px) rotate(15deg); }
            100% { transform: translateY(0) rotate(10deg); }
        }
        @keyframes float-p3 {
            0% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-18px) rotate(-2deg); }
            100% { transform: translateY(0) rotate(-6deg); }
        }
        
        @keyframes float-pf1 {
            0% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-15px) rotate(8deg); }
            100% { transform: translateY(0) rotate(5deg); }
        }
        @keyframes float-pf2 {
            0% { transform: translateY(0) rotate(-7deg); }
            50% { transform: translateY(-10px) rotate(-3deg); }
            100% { transform: translateY(0) rotate(-7deg); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .photo-frame img {
                width: 110px;
                height: 110px;
            }
            .photo-frame {
                padding: 8px 8px 28px 8px;
            }
            .photo-1 { top: 5%; left: 5%; }
            .photo-2 { bottom: 5%; left: 5%; }
            .photo-3 { top: 8%; right: 5%; bottom: auto; }
            .photo-first-1 { top: 10%; right: 5%; }
            .photo-first-2 { bottom: 10%; left: 5%; }
            .container { padding: 30px 40px; min-width: 250px; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <!-- Photos for first message -->
    <div class="photo-frame photo-first photo-first-1">
        <img src="https://i.pinimg.com/736x/2c/0b/88/2c0b880cda5dcfa4ebd30b405415395d.jpg" alt="First Photo 1">
    </div>
    <div class="photo-frame photo-first photo-first-2">
        <img src="https://i.pinimg.com/736x/4c/9e/d5/4c9ed5defb616772e304c9c33097fee6.jpg" alt="First Photo 2">
    </div>

    <!-- Photos for second message -->
    <div class="photo-frame photo-second photo-1" id="photo1">
        <img src="https://i.pinimg.com/736x/95/55/60/955560a7f9e13af9a91c927ff06d002d.jpg" alt="Photo 1">
    </div>
    <div class="photo-frame photo-second photo-2" id="photo2">
        <img src="https://i.pinimg.com/736x/f6/2e/7c/f62e7ceba898d4cbe29d8f5a2ea8c9ec.jpg" alt="Photo 2">
    </div>
    <div class="photo-frame photo-second photo-3" id="photo3">
        <img src="https://i.pinimg.com/1200x/46/42/bb/4642bbb7ea6581d096d0b434da574443.jpg" alt="Photo 3">
    </div>

    <div class="container">
        <h1 id="message">Mở ra rồi hả?</h1>
    </div>

    <script>
        const messageEl = document.getElementById('message');
        const secondPhotos = document.querySelectorAll('.photo-second');
        const firstPhotos = document.querySelectorAll('.photo-first');
        const messages = [
            "Mở ra rồi hả?",
            "Nhắn tin cho tui đi <span class='heart'>😁</span>"
        ];
        
        // Fade in first photos on load
        setTimeout(() => {
            firstPhotos.forEach(photo => photo.classList.add('show'));
        }, 100);

        let currentIndex = 0;

        function showNextMessage() {
            currentIndex++;
            if (currentIndex < messages.length) {
                
                messageEl.classList.add('fade-out');
                // Fade out first photos
                firstPhotos.forEach(photo => photo.classList.remove('show'));
                
                setTimeout(() => {
                    
                    messageEl.innerHTML = messages[currentIndex];
                    messageEl.classList.remove('fade-out');
                    
                    // Show second photos when the last message appears
                    if (currentIndex === messages.length - 1) {
                        secondPhotos.forEach(photo => photo.classList.add('show'));
                    }
                    
                    if (currentIndex < messages.length - 1) {
                        setTimeout(showNextMessage, 1800);
                    }
                }, 500);
            }
        }

        setTimeout(showNextMessage, 1800);
    </script>
</body>
</html>
